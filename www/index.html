<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>universe</title>
  <meta name="description" content="A cosmic zoom from the inner solar system to the observable universe.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="space"></canvas>
  <div id="hud">
    <div id="title">universe<span>a cosmic zoom</span></div>
    <div id="help">scroll zooms · drag pans · hover for details · digits jump levels · k TNOs · u local bubble · l local arm · h halo · g galactic center · b black hole · click a planet for moons · space pauses · o overview · p tour</div>
    <div id="modes"><button id="tour" title="p">Tour</button><button id="overview" title="o">Overview</button></div>
    <div id="hover-info" hidden><div class="name"></div><div class="details"></div></div>
    <div id="time">
      <div id="speeds"></div>
      <div id="date"></div>
    </div>
    <div id="bottom">
      <div id="readouts">
        <div id="scalebar"><div class="bar"></div><span class="label"></span></div>
        <div id="caption">Distances to scale. Dots are not.</div>
      </div>
      <div id="levels"></div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
