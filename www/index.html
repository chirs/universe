<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>universe</title>
  <meta name="description" content="A to-scale map from the inner solar system to the observable universe.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="space"></canvas>
  <div id="hud">
    <div id="top">
      <div id="title">universe<span>you are here</span></div>
      <div id="modes">
        <button id="overview" title="o">Overview</button>
        <button id="sound" title="m">Sound</button>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.5" title="Volume" hidden>
        <div class="menu">
          <button id="help-toggle" title="?">?</button>
          <div id="help" class="menu-list down" hidden>
            <div class="help-col">
              <div class="group">Controls</div>
              <dl>
                <dt>scroll</dt><dd>zoom</dd>
                <dt>drag</dt><dd>pan</dd>
                <dt>+ &minus;</dt><dd>zoom</dd>
                <dt>hover</dt><dd>details</dd>
                <dt>click</dt><dd>visit a planet, star system or galaxy</dd>
                <dt>space</dt><dd>pause / resume time</dd>
                <dt>o</dt><dd>overview</dd>
                <dt>m</dt><dd>sound</dd>
                <dt>?</dt><dd>this help</dd>
                <dt>esc</dt><dd>close menus</dd>
              </dl>
            </div>
            <div class="help-col">
              <div class="group">Jump to</div>
              <dl id="help-jumps"></dl>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="hover-info" hidden><div class="name"></div><div class="details"></div></div>
    <div id="time">
      <span id="date"></span>
      <button id="play" title="space"></button>
      <div class="menu">
        <button id="speed-toggle" title="Time speed"></button>
        <div id="speeds" class="menu-list down" hidden></div>
      </div>
    </div>
    <div id="bottom">
      <div id="readouts">
        <div id="scalebar"><div class="bar"></div><span class="label"></span></div>
        <div id="caption">Distances to scale. Dots are not.</div>
      </div>
      <div id="levels"></div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
